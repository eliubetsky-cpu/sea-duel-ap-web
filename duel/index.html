<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Sea Duel</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <style>
      /*
        The stock template lays the player out as a fixed 1024x576 box, absolutely
        positioned and centred with a translate. Absolute positioning takes it out of the flow, so the
        page has no height of its own and cannot scroll - and centring a box taller than the window puts
        its top edge at a negative offset. On any screen shorter than the canvas, the top of the game was
        therefore both cut off and unreachable: nothing to scroll, nowhere to scroll to.

        Here the canvas is fitted to the window instead, keeping the aspect the camera framing is built
        around. Whichever of the two limits binds first decides the size, so the player is letterboxed
        rather than cropped or stretched.
      */
      :root {
        --app-height: 100vh;
        --ground: #14110c;
      }

      /* Mobile browsers count the space under their own collapsing toolbars in 100vh, which hides the
         top of the canvas behind the address bar. dvh is the height actually on screen. */
      @supports (height: 100dvh) {
        :root { --app-height: 100dvh; }
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--ground);
        overflow: hidden;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        display: block;
        background: var(--ground);
        width: min(100vw, calc(var(--app-height) * 1024 / 576));
        height: min(var(--app-height), calc(100vw * 576 / 1024));

        /* The game is played by dragging and tapping on the arena. Without this the browser reads a
           drag as a scroll or a pinch and takes the input for itself. */
        touch-action: none;
      }

      #unity-canvas:focus { outline: none; }

      #unity-loading {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(60vw, 240px);
        font: 14px/1.4 system-ui, sans-serif;
        color: #c9bda2;
        text-align: center;
      }

      #unity-loading-track {
        margin-top: 10px;
        height: 4px;
        border-radius: 2px;
        background: #2b2620;
        overflow: hidden;
      }

      #unity-loading-fill {
        width: 0%;
        height: 100%;
        background: #a6392c;
        transition: width 0.15s linear;
      }

      #unity-warning {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        max-width: 90vw;
        font: 13px/1.4 system-ui, sans-serif;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1024" height="576" tabindex="-1"></canvas>
    </div>

    <div id="unity-loading">
      Sea Duel
      <div id="unity-loading-track"><div id="unity-loading-fill"></div></div>
    </div>

    <div id="unity-warning"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style.cssText = "padding:8px;border-radius:8px;margin-bottom:6px;background:" +
          (type === "error" ? "#a6392c" : type === "warning" ? "#8a6410" : "#2b2620") + ";color:#fff";
        banner.appendChild(div);
        if (type !== "error") setTimeout(function () { banner.removeChild(div); }, 5000);
      }

      // Around the GitHub Pages / browser cache: index.html stays the same between deploys, and the build
      // folder's name is read from build.txt with a cache-busting parameter - tools/deploy.sh writes
      // Build-<epoch> there. Locally there is no build.txt, so the folder is Build.
      var buildUrl = (function () {
        try {
          var x = new XMLHttpRequest(); x.open("GET", "build.txt?t=" + Date.now(), false); x.send();
          if (x.status === 200 && /^Build[\w-]*$/.test(x.responseText.trim())) return x.responseText.trim();
        } catch (e) {}
        return "Build";
      })();
      // On a phone Unity's canvas is drawn at the device's pixel density by default - at DPR 3 that is three
      // times the pixels on each axis, nine times the work a frame. The drawing buffer is kept here instead:
      // density no higher than 2 and no more than a pixel budget; CSS stretches the canvas as before.
      // The budget (2.1 million) keeps the canvas no smaller than its place on screen, so the HUD and its text
      // are drawn pixel for pixel. The world is cheaper than the canvas anyway: URP draws the scene at render
      // scale 0.75 and upscales it with FSR, while the Screen Space - Overlay UI stays sharp. The budget can be
      // tuned from the link: ?px=900000 is gentler on a phone.
      var MAX_PIXELS = (function () {
        var m = /[?&]px=(\d+)/.exec(location.search);
        return m ? Math.max(120000, Math.min(4000000, parseInt(m[1], 10))) : 2100000;   // ~1920×1094
      })();
      function sizeCanvas() {
        var rect = canvas.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = Math.max(1, Math.round(rect.width * dpr));
        var h = Math.max(1, Math.round(rect.height * dpr));
        var scale = Math.sqrt(MAX_PIXELS / (w * h));
        if (scale < 1) { w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale)); }
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      }
      sizeCanvas();
      window.addEventListener("resize", sizeCanvas);
      window.addEventListener("orientationchange", sizeCanvas);

      var config = {
        matchWebGLToCanvasSize: false,
        arguments: [],
        dataUrl: buildUrl + "/Frigate-Duel-WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/Frigate-Duel-WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/Frigate-Duel-WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "TashaDz",
        productName: "Sea Duel",
        productVersion: "experiment/tactical-duel 838d1d1+ 2026-10-23 18:50",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/Frigate-Duel-WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-loading-fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#unity-loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
